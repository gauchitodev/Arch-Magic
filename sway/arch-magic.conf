# ✦ Arch-Magic — piezas de Sway para el teléfono
#
# 🚧 Bosquejo: escrito antes de que llegue el teléfono, sin probar.
#
# Agregar al config de Sway (el repo se ve en /opt/arch-magic, ver 03-chroot):
#   include /opt/arch-magic/sway/arch-magic.conf

# Pantallas de trabajo apiladas en vertical, una al lado de la otra en un monitor.
default_orientation auto

# La línea de abajo, estilo Motorola.
exec python3 /opt/arch-magic/sway/linea.py

# Teclado en pantalla, escondido hasta que salga el slider.
# Colores Arcano: fondo, teclas, teclas especiales, tecla apretada, texto.
exec wvkbd-mobintl --hidden -L 300 \
    --bg 13101Aff --fg 1E1828ff --fg-sp 2A2138ff \
    --press 9B6BFFff --text E4DFF0ff

# Sin bordes ni barras de título: en una pantalla chica cada píxel cuenta.
default_border pixel 2
client.focused #9B6BFF #9B6BFF #13101A #E8C15A #9B6BFF
client.unfocused #13101A #13101A #E4DFF0 #13101A #13101A
